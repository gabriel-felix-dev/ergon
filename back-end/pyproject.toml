[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "auth", "db", "services", "worker"]

[project]
name = "ergon-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-mail>=0.10,<1",
    "pg8000>=1.31,<2",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
